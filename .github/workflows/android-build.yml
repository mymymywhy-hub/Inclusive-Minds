name: Build Android app

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # `secrets` isn't allowed directly in a step's `if:` condition, so it's
      # threaded through a plain env var first.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IM-Stories-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Release build: produces a signed, Play-Store-ready .aab automatically
      # once the four ANDROID_* secrets below are added to this repository
      # (Settings -> Secrets and variables -> Actions). Until then this step
      # still runs and produces an UNSIGNED .aab, which cannot be uploaded to
      # Play Console as-is.
      - name: Decode release keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.HAS_KEYSTORE == 'true' && 'release.keystore' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: IM-Stories-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Gives a stable, directly-downloadable link (no GitHub Actions login/
      # navigation needed) that always points at the latest successful build:
      # https://github.com/<owner>/<repo>/releases/tag/latest-build
      - name: Rename build outputs for the release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk IM-Stories-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab "IM-Stories-release${{ env.HAS_KEYSTORE == 'true' && '' || '-UNSIGNED' }}.aab"

      - name: Publish "latest-build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "IM Stories — latest build"
          body: |
            Automatically rebuilt from commit ${{ github.sha }} on ${{ github.ref_name }}.

            - **IM-Stories-debug.apk** — installable now (enable "install from unknown sources" on your phone). Not signed for Play Store.
            - **IM-Stories-release*.aab** — the format Play Console requires. Signed and upload-ready only once the `ANDROID_KEYSTORE_*` secrets are set (see README); otherwise it's marked UNSIGNED and Play Console will reject it.

            This release is overwritten by every successful build — the link above always has the newest version.
          files: |
            IM-Stories-debug.apk
            IM-Stories-release*.aab
          make_latest: true
